
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR GIFTS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 18px 45px;
  background:
    radial-gradient(ellipse at 50% 0%, #173c27 0%, #080d09 48%);
  color: #fff;
  font-family: Arial, sans-serif;
}

.header {
  text-align: center;
  padding: 22px 0;
}

.logo {
  font-size: 11px;
  letter-spacing: 6px;
  color: #73d992;
}

h1 {
  font-size: 34px;
  letter-spacing: 4px;
  margin: 12px 0 8px;
}

.subtitle {
  color: #8ca895;
  font-size: 12px;
  letter-spacing: 2px;
}

.card {
  background: linear-gradient(145deg, #172b1e, #101912);
  border: 1px solid #315b3c;
  border-radius: 21px;
  padding: 23px;
  margin-top: 19px;
  box-shadow: 0 10px 35px #0005;
}

.balance {
  text-align: center;
  padding: 29px 20px;
}

.label {
  color: #91a897;
  font-size: 11px;
  letter-spacing: 2px;
}

.balance-number {
  font-size: 43px;
  font-weight: bold;
  color: #83e6a0;
  margin: 18px 0 10px;
}

.demo {
  color: #779481;
  font-size: 11px;
}

.section-title {
  font-size: 17px;
  margin: 4px 0 17px;
}

.gift-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.gift {
  background: #0c1710;
  border: 1px solid #284832;
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
}

.gift-art {
  font-size: 43px;
  margin: 8px 0 14px;
}

.gift-name {
  font-size: 13px;
  font-weight: bold;
}

.gift-info {
  color: #8ca393;
  font-size: 11px;
  margin-top: 7px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 17px;
  border: 1px solid #5aaf70;
  border-radius: 13px;
  background: linear-gradient(100deg, #246d3a, #328a4d);
  color: white;
  font-size: 14px;
  font-weight: bold;
}

button:active {
  transform: scale(.98);
}

.profile {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: #24432d;
  display: grid;
  place-items: center;
  font-size: 23px;
}

.profile-name {
  font-weight: bold;
  margin-bottom: 6px;
}

.footer {
  text-align: center;
  color: #607b67;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">EXCLUSIVE COLLECTION</div>
  <h1>NOIR GIFTS</h1>
  <div class="subtitle">YOUR WORLD OF GIFTS</div>
</header>

<section class="card balance">
  <div class="label">YOUR BALANCE</div>
  <div class="balance-number">⭐ 100</div>
  <div class="demo">DEMO BALANCE · NOT REAL STARS</div>
</section>

<section class="card">
  <h2 class="section-title">Коллекция подарков</h2>

  <div class="gift-grid">

    <div class="gift">
      <div class="gift-art">🎁</div>
      <div class="gift-name">Mystery Box</div>
      <div class="gift-info">Скоро появится</div>
    </div>

    <div class="gift">
      <div class="gift-art">🌹</div>
      <div class="gift-name">Rose</div>
      <div class="gift-info">Скоро появится</div>
    </div>

    <div class="gift">
      <div class="gift-art">💎</div>
      <div class="gift-name">Diamond</div>
      <div class="gift-info">Скоро появится</div>
    </div>

    <div class="gift">
      <div class="gift-art">🧸</div>
      <div class="gift-name">Teddy Bear</div>
      <div class="gift-info">Скоро появится</div>
    </div>

  </div>

  <button onclick="showCatalog()">
    ОТКРЫТЬ КАТАЛОГ
  </button>
</section>

<section class="card">
  <h2 class="section-title">Личный кабинет</h2>

  <div class="profile">
    <div class="avatar">♟</div>
    <div>
      <div class="profile-name" id="username">
        Гость
      </div>
      <div class="label" id="userstatus">
        DEMO PROFILE
      </div>
    </div>
  </div>
</section>

<div class="footer">
  NOIR GIFTS · DEMO EDITION
</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
  document.getElementById("username").textContent =
    user.first_name || "Пользователь";

  document.getElementById("userstatus").textContent =
    "TELEGRAM CONNECTED";
}

function showCatalog() {
  if (tg.showAlert) {
    tg.showAlert("Каталог пока находится в разработке.");
  } else {
    alert("Каталог пока находится в разработке.");
  }
}
</script>

</body>
</html>
